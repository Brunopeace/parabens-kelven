<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Controle | Salgados Delícia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/adm.css">
    <link rel="icon" href="img/icone-512.png">
    <link rel="manifest" href="manifest-adm.json">
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <div>
                <h1>Gerenciador de Pedidos</h1>
                <p style="color: #6B7280;">Acompanhe e atualize os pedidos em tempo real</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btn-push" onclick="ativarNotificacoesPush()" style="background: #4f46e5; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;">
                    <i class="fas fa-bell"></i> Ativar Push
                </button>
                <span class="badge" id="painel-status">Conectado</span>
            </div>
        </div>

        <div class="admin-controls">
            <div class="status-info">
                <h3 id="txt-status-loja">Status da Operação: <span style="color: #10b981;">Normal</span></h3>
                <p id="desc-status-loja">A loja está seguindo o horário automático.</p>
            </div>
            <button id="btn-toggle-emergencia" class="btn-emergency open-now" onclick="toggleEmergencia()">
                <i class="fas fa-power-off"></i>
                <span id="btn-texto-emergencia">Pausar Vendas</span>
            </button>
        </div>

        <div id="lista-pedidos-container">
            <div style="text-align: center; grid-column: 1/-1; padding: 50px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #D97706;"></i>
                <p>Carregando pedidos...</p>
            </div>
        </div>
    </div>
    
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZII2LWg1D4usoWiWtwrvHsi--YxKSo3c",
        authDomain: "salgadosdelicia-b0032.firebaseapp.com",
        databaseURL: "https://salgadosdelicia-b0032-default-rtdb.firebaseio.com",
        projectId: "salgadosdelicia-b0032",
        storageBucket: "salgadosdelicia-b0032.firebasestorage.app",
        messagingSenderId: "273362591423",
        appId: "1:273362591423:web:1b179a8b9003df8d33300a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messaging = getMessaging(app);
    
    const statusRef = ref(db, 'configuracoes/lojaBloqueada');
    const container = document.getElementById('lista-pedidos-container'); 
    let lojaEstaBloqueada = false;

    // --- FUNÇÃO PARA ATIVAR NOTIFICAÇÕES PUSH (FCM) ---
    window.ativarNotificacoesPush = function() {
        Notification.requestPermission().then((permission) => {
            if (permission === 'granted') {
                // Forçamos o registro manual apontando para o arquivo na pasta /SALGADOS/
                navigator.serviceWorker.register('./firebase-messaging-sw.js').then((registration) => {
                    console.log("✅ Service Worker registrado para Push na pasta!");

                    // Pegamos o token informando ao Firebase qual é o registro correto
                    return getToken(messaging, { 
                        vapidKey: 'BPTear-W70lY11qDM7pm8o8P6iF-0oNWI6nrHoqaORpi8n5P2PqtYW3pHpSt3CZmhZfHRFVmjL-FR4D6EfiYWoQ',
                        serviceWorkerRegistration: registration 
                    });
                }).then((currentToken) => {
                    if (currentToken) {
                        set(ref(db, 'tokens_adm/' + currentToken.slice(0, 15)), {
                            token: currentToken,
                            ultimaAtualizacao: new Date().toLocaleString(),
                            dispositivo: navigator.platform
                        });
                        alert("✅ Notificações Push ativadas com sucesso!");
                        console.log("Token FCM:", currentToken);
                    }
                }).catch((err) => {
                    console.error('Erro ao obter token:', err);
                    alert("Erro ao ativar Push. Veja o console.");
                });
            } else {
                alert("Você precisa permitir as notificações no navegador.");
            }
        });
    };

    // --- ESCUTA O STATUS DA LOJA ---
    onValue(statusRef, (snapshot) => {
        lojaEstaBloqueada = snapshot.val() || false;
        atualizarBotaoStatus(lojaEstaBloqueada);
    });

    window.atualizarBotaoStatus = function(isBloqueada) {
        const btn = document.getElementById('btn-toggle-emergencia');
        const textoBtn = document.getElementById('btn-texto-emergencia');
        const tituloStatus = document.getElementById('txt-status-loja');
        const descStatus = document.getElementById('desc-status-loja');
        if (!btn) return;

        if (isBloqueada) {
            btn.className = "btn-emergency closed-now";
            if (textoBtn) textoBtn.innerText = "Reabrir Loja agora";
            tituloStatus.innerHTML = 'Status: <span style="color: #dc2626; font-weight: 800;">LOJA FECHADA</span>';
            descStatus.innerHTML = "<strong>Atenção:</strong> A loja está pausada.";
        } else {
            btn.className = "btn-emergency open-now";
            if (textoBtn) textoBtn.innerText = "Fechar Loja (Imprevisto)";
            tituloStatus.innerHTML = 'Status: <span style="color: #10b981; font-weight: 800;">LOJA ABERTA</span>';
            descStatus.innerHTML = "<strong>Horário:</strong> Aberta (Até 23:00)";
        }
    };

    window.toggleEmergencia = function() {
        set(statusRef, !lojaEstaBloqueada);
    };

    let primeiraCarga = true;
    const somNovoPedido = new Audio('https://www.myinstants.com/media/sounds/ding-sound-effect_1.mp3');

    // --- ESCUTAR PEDIDOS ---
    onValue(ref(db, 'pedidos'), (snapshot) => {
        const pedidos = snapshot.val();
        if (!container) return;

        if (!primeiraCarga && pedidos) {
            somNovoPedido.play().catch(() => console.log("Áudio bloqueado"));
            if (Notification.permission === "granted") {
                new Notification("🍕 Novo Pedido!", { body: "Confira no painel.", icon: "img/icone-512.png" });
            }
        }
        primeiraCarga = false;
        container.innerHTML = ""; 

        if (!pedidos) {
            container.innerHTML = "<p style='text-align:center; padding:20px;'>Sem pedidos no momento.</p>";
            return;
        }

        Object.keys(pedidos).reverse().forEach(id => {
            const p = pedidos[id];
            const itensSeguros = p.itens || []; 
            const listaItens = itensSeguros.map(item => `
                <li style="list-style: none;">
                    <strong>(x${item.quantidade || 1})</strong> ${item.nome}
                    ${item.extras ? `<br><small style="color: #6B7280; margin-left: 15px;">↳ ${item.extras.join(', ')}</small>` : ''}
                </li>`).join('');

            const card = document.createElement('div');
            card.className = `order-card ${p.status === 2 ? 'finalizado' : ''}`;
            card.innerHTML = `
                <div class="pedido-info">
                    <h3>#${id.slice(-4)} - ${p.cliente}</h3>
                    <p><strong>📞 Tel:</strong> ${p.telefone}</p>
                    <ul style="margin: 10px 0;">${listaItens}</ul>
                    <p style="text-align: right; font-weight: bold;">Total: R$ ${(p.total || 0).toFixed(2)}</p>
                </div>
                <div class="status-group">
                    <button onclick="mudarStatus('${id}', 1)" class="btn-status btn-prep">Preparar</button>
                    <button onclick="mudarStatus('${id}', 2)" class="btn-status btn-ready">Entregar</button>
                    <button onclick="excluirPedido('${id}')" class="btn-status btn-cancel">Excluir</button>
                </div>
                <div class="whatsapp-tools">
                    <button class="btn-status btn-wa" onclick="avisarWA('${p.telefone}', '${p.cliente}', 'preparo')">WhatsApp Preparo</button>
                    <button class="btn-status btn-wa" onclick="avisarWA('${p.telefone}', '${p.cliente}', 'pronto')">WhatsApp Saiu</button>
                </div>`;
            container.appendChild(card);
        });
    });

    window.mudarStatus = (id, novoStatus) => update(ref(db, `pedidos/${id}`), { status: novoStatus });
    window.excluirPedido = (id) => confirm("Excluir pedido?") && remove(ref(db, `pedidos/${id}`));
    window.avisarWA = (tel, nome, tipo) => {
        let num = tel.replace(/\D/g, '');
        if (num.length <= 11) num = "55" + num;
        let msg = tipo === 'preparo' ? `Pedido de ${nome} em preparo!` : `Pedido de ${nome} saiu para entrega!`;
        window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
    };
    </script>

    <script>
    // Registro do SW para o Painel usar cache e monitoramento de banco
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./firebase-messaging-sw.js').then(reg => console.log('SW ✅'));
    }
    </script>
</body>
</html>
