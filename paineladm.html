<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Controle | Salgados Delícia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/adm.css">
    <link rel="apple-touch-icon" href="img/icone-512.png">
    <link rel="manifest" href="manifest-adm.json">
    

</head>
<body>
    <div class="admin-container">
        <div class="header">
            <div>
                <h1>Gerenciador de Pedidos</h1>
                <p style="color: #6B7280;">Acompanhe e atualize os pedidos em tempo real</p>
            </div>
            <span class="badge" id="painel-status">Conectado</span>
        </div>

        <div class="admin-controls">
            <div class="status-info">
                <h3 id="txt-status-loja">Status da Operação: <span style="color: #10b981;">Normal</span></h3>
                <p id="desc-status-loja">A loja está seguindo o horário automático.</p>
            </div>
            <button id="btn-toggle-emergencia" class="btn-emergency open-now" onclick="toggleEmergencia()">
                <i class="fas fa-power-off"></i>
                <span id="btn-texto-emergencia">Pausar Vendas</span>
            </button>
        </div>

        <div id="lista-pedidos-container">
            <div style="text-align: center; grid-column: 1/-1; padding: 50px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #D97706;"></i>
                <p>Carregando pedidos...</p>
            </div>
        </div>
    </div>
    
    
    <script type="module">
    // 1. IMPORTAÇÕES COMPLETAS
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZII2LWg1D4usoWiWtwrvHsi--YxKSo3c",
        authDomain: "salgadosdelicia-b0032.firebaseapp.com",
        databaseURL: "https://salgadosdelicia-b0032-default-rtdb.firebaseio.com",
        projectId: "salgadosdelicia-b0032",
        storageBucket: "salgadosdelicia-b0032.firebasestorage.app",
        messagingSenderId: "273362591423",
        appId: "1:273362591423:web:1b179a8b9003df8d33300a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // Referências e Elementos
    const statusRef = ref(db, 'configuracoes/lojaBloqueada');
    const container = document.getElementById('lista-pedidos-container'); 
    let lojaEstaBloqueada = false;

    // --- ESCUTA O STATUS DA LOJA ---
    onValue(statusRef, (snapshot) => {
        lojaEstaBloqueada = snapshot.val() || false;
        atualizarBotaoStatus(lojaEstaBloqueada);
    });

    window.atualizarBotaoStatus = function(isBloqueada) {
        const btn = document.getElementById('btn-toggle-emergencia');
        const textoBtn = document.getElementById('btn-texto-emergencia');
        const tituloStatus = document.getElementById('txt-status-loja');
        const descStatus = document.getElementById('desc-status-loja');
        if (!btn) return;

        if (isBloqueada) {
            btn.className = "btn-emergency closed-now";
            if (textoBtn) textoBtn.innerText = "Reabrir Loja agora";
            tituloStatus.innerHTML = 'Status: <span style="color: #dc2626; font-weight: 800;">LOJA FECHADA</span>';
            descStatus.innerHTML = "<strong>Atenção:</strong> A loja está pausada para todos os clientes.";
            btn.parentElement.style.borderLeft = "6px solid #dc2626";
        } else {
            btn.className = "btn-emergency open-now";
            if (textoBtn) textoBtn.innerText = "Fechar Loja (Imprevisto)";
            tituloStatus.innerHTML = 'Status: <span style="color: #10b981; font-weight: 800;">LOJA ABERTA</span>';
            descStatus.innerHTML = "<strong>Horário:</strong> Aberta (Fecha automático 23:00)";
            btn.parentElement.style.borderLeft = "6px solid #10b981";
        }
    };

    window.toggleEmergencia = function() {
        set(statusRef, !lojaEstaBloqueada);
    };

    // --- ESCUTAR PEDIDOS EM TEMPO REAL ---
    onValue(ref(db, 'pedidos'), (snapshot) => {
        const pedidos = snapshot.val();
        if (!container) return;
        container.innerHTML = ""; 

        if (!pedidos) {
            container.innerHTML = "<p style='text-align:center; padding:20px;'>Aguardando novos pedidos...</p>";
            document.getElementById('painel-status').innerText = "Painel Ativo";
            return;
        }

        // Transformar em array e inverter para os novos aparecerem primeiro
        const idsOrdenados = Object.keys(pedidos).reverse();

        idsOrdenados.forEach(id => {
            const p = pedidos[id];
            const itensSeguros = p.itens || []; 
            
            // ALTERAÇÃO: Agora inclui a quantidade (xQtd) no texto do item
            const listaItens = itensSeguros.map(item => {
                const extrasSeguros = item.extras || [];
                const qtd = item.quantidade || 1;
                           
                return `
                    <li style="margin-bottom: 5px; list-style: none;">
                        <strong style="color: #D97706; margin-right: 10px;">(x${qtd})</strong> ${item.nome}
                        ${extrasSeguros.length > 0 ? `<br><small style="color: #6B7280; margin-left: 20px;">↳ ${extrasSeguros.join(', ')}</small>` : ''}
                    </li>`;
            }).join('');

            const card = document.createElement('div');
            card.className = `order-card ${p.status === 2 ? 'finalizado' : ''}`;
            card.innerHTML = `
                <div class="pedido-info">
                    <div style="display: flex; justify-content: space-between;">
                        <h3><strong class="txt-nome-pedido" style=" margin-right:11px;">Pedido:</strong> #${id.slice(-4)} <amall class="txt-nome-cliente">Cliente</amall> - <amall>${(p.cliente || 'Sem Nome').toUpperCase()}</amall></h3>
                        <small style=" color: green; margin-top: 5px;">${p.data || ''}</small>
                    </div>
                    <p><strong>📞 Tel:</strong> ${p.telefone}</p>
                    <ul class="lista-itens-detalhe" style="padding: 0; margin: 10px 0;">
                        ${listaItens}
                    </ul>
                    <p class="total-pedido" style="font-weight: 800; font-size: 1.1rem; border-top: 1px solid #eee; pt: 5px;">
                        Total: R$ ${(p.total || 0).toFixed(2)}
                    </p>
                </div>
                <div class="status-group">
                    <button onclick="mudarStatus('${id}', 1)" class="btn-status btn-prep">Preparar</button>
                    <button onclick="mudarStatus('${id}', 2)" class="btn-status btn-ready">Entregar</button>
                    <button onclick="excluirPedido('${id}')" class="btn-status btn-cancel">Excluir</button>
                </div>
                <div class="whatsapp-tools">
                    <button class="btn-status btn-wa" onclick="avisarWA('${p.telefone}', '${p.cliente}', 'preparo')">
                        <i class="fab fa-whatsapp"></i> Preparando
                    </button>
                    <button class="btn-status btn-wa" onclick="avisarWA('${p.telefone}', '${p.cliente}', 'pronto')">
                        <i class="fab fa-whatsapp"></i> Saiu para Entrega
                    </button>
                </div>`;
            container.appendChild(card);
        });
    });

    // Funções Globais expostas para os botões
    window.mudarStatus = (id, novoStatus) => {
        update(ref(db, `pedidos/${id}`), { status: novoStatus });
    };

    window.excluirPedido = (id) => {
        if (confirm("Deseja remover este pedido do painel?")) {
            remove(ref(db, `pedidos/${id}`));
        }
    };

    window.avisarWA = (telefone, nome, tipo) => {
        let numeroLimpo = telefone.replace(/\D/g, '');
        if (numeroLimpo.length <= 11) numeroLimpo = "55" + numeroLimpo;
        const nomeLoja = "*Salgados Delícia* 🥟";
        let msg = (tipo === 'preparo') 
            ? `*BOAS NOTÍCIAS, ${nome.toUpperCase()}!* 🎉\nSeu pedido começou a ser preparado! 🔥\n${nomeLoja}`
            : `*ESTÁ A CAMINHO!* 🛵💨\nO entregador saiu com seus salgados quentinhos, ${nome}! 😍\n${nomeLoja}`;
        window.open(`https://wa.me/${numeroLimpo}?text=${encodeURIComponent(msg)}`, '_blank');
    };
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        // CORREÇÃO: Nome exato do seu arquivo e removido o scope fixo para evitar conflito na raiz
        navigator.serviceWorker.register('service-worker.js')
        .then(function(registration) {
            console.log('✅ Painel ADM registrado com sucesso!');
        })
        .catch(function(err) {
            console.log('❌ Erro: Verifique se o arquivo service-worker.js está na mesma pasta.', err);
        });
    });
}

/* Botão de Instalar Painel */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    
    if (!document.querySelector('.btn-install-adm')) {
        const btnInstall = document.createElement('button');
        btnInstall.className = 'btn-install-adm';
        btnInstall.innerHTML = '<i class="fas fa-tools"></i> Instalar Painel';
        btnInstall.style = "position:fixed; bottom:20px; left:20px; z-index:1000; background:#1f2937; color:white; border:none; padding:12px 20px; border-radius:30px; cursor:pointer; font-weight:bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);";
        document.body.appendChild(btnInstall);

        btnInstall.addEventListener('click', () => {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') btnInstall.remove();
                deferredPrompt = null;
            });
        });
    }
});
</script>

</body>
</html>
